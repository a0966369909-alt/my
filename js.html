<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>js.html - 我的迷你購物網站</title>
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 20px;">

    <!-- 頂部導覽列 -->
    <div style="display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 30px; border-radius: 12px; border: 1px solid #334155;">
        <h1 style="margin: 0; font-size: 24px; color: #38bdf8;">🛍️ 質感選物小鋪</h1>
        <div id="cartIcon" style="font-size: 18px; background: #0f172a; padding: 10px 20px; border-radius: 20px; border: 1px solid #38bdf8; cursor: pointer;" onclick="toggleCartModal()">
            🛒 購物車：<span id="cartCount" style="color: #38bdf8; font-weight: bold;">0</span> 件
        </div>
    </div>

    <!-- 商品列表區塊 -->
    <div style="margin-top: 30px;">
        <h2 style="border-bottom: 2px solid #334155; padding-bottom: 10px;">熱門商品</h2>
        
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            
            <!-- 商品 1 -->
            <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 220px; padding: 20px; text-align: center;">
                <div style="font-size: 60px; margin-bottom: 10px;">👟</div>
                <h3 style="margin: 10px 0;">極速炫風跑鞋</h3>
                <p style="color: #94a3b8; font-size: 14px;">NT$ 2,500</p>
                <button onclick="addToCart('極速炫風跑鞋', 2500, event)" style="background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 20px; cursor: pointer;">
                    加入購物車 🚀
                </button>
            </div>

            <!-- 商品 2 -->
            <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 220px; padding: 20px; text-align: center;">
                <div style="font-size: 60px; margin-bottom: 10px;">🎧</div>
                <h3 style="margin: 10px 0;">降噪無線耳機</h3>
                <p style="color: #94a3b8; font-size: 14px;">NT$ 3,800</p>
                <button onclick="addToCart('降噪無線耳機', 3800, event)" style="background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 20px; cursor: pointer;">
                    加入購物車 🚀
                </button>
            </div>

            <!-- 商品 3 -->
            <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 220px; padding: 20px; text-align: center;">
                <div style="font-size: 60px; margin-bottom: 10px;">📷</div>
                <h3 style="margin: 10px 0;">復古數位相機</h3>
                <p style="color: #94a3b8; font-size: 14px;">NT$ 6,200</p>
                <button onclick="addToCart('復古數位相機', 6200, event)" style="background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 20px; cursor: pointer;">
                    加入購物車 🚀
                </button>
            </div>

        </div>
    </div>

    <!-- 購物車清單彈跳視窗 (預設隱藏) -->
    <div id="cartModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000;">
        <div style="background: #1e293b; width: 400px; margin: 100px auto; padding: 30px; border-radius: 15px; border: 1px solid #38bdf8; position: relative;">
            <h2 style="margin-top: 0; color: #38bdf8;">🛒 您的購物車</h2>
            <div id="cartItemList" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px; color: #cbd5e1;">
                <p>購物車是空的～快去選購吧！</p>
            </div>
            <hr style="border-color: #334155;">
            <p style="font-size: 18px; font-weight: bold; text-align: right;">總計：NT$ <span id="cartTotal">0</span></p>
            
            <div style="text-align: right; margin-top: 20px;">
                <button onclick="checkout()" style="background: #22c55e; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-right: 10px;">去結帳</button>
                <button onclick="toggleCartModal()" style="background: #64748b; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer;">關閉</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 互動邏輯 -->
    <script>
        let cart = [];

        // 加入購物車並觸發粒子與飛入特效
        function addToCart(name, price, event) {
            let btn = event.target;
            
            // 1. 資料加入陣列
            cart.push({ name: name, price: price });
            updateCartCount();

            // 2. 按鈕點擊特效
            let originalText = btn.innerText;
            btn.innerText = "✨ 已加入！";
            btn.style.backgroundColor = "#22c55e";
            btn.style.color = "#ffffff";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = "#38bdf8";
                btn.style.color = "#0f172a";
            }, 800);

            // 3. 粒子爆炸特效
            let rect = btn.getBoundingClientRect();
            for (let i = 0; i < 10; i++) {
                createParticle(rect.left + rect.width / 2, rect.top + rect.height / 2);
            }
        }

        // 更新購物車數量與內容
        function updateCartCount() {
            let countSpan = document.getElementById("cartCount");
            countSpan.innerText = cart.length;

            let itemList = document.getElementById("cartItemList");
            let totalSpan = document.getElementById("cartTotal");

            if (cart.length === 0) {
                itemList.innerHTML = "<p>購物車是空的～快去選購吧！</p>";
                totalSpan.innerText = "0";
                return;
            }

            let html = "";
            let total = 0;
            for (let i = 0; i < cart.length; i++) {
                html += `<div style="display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #334155; padding-bottom: 5px;">
                    <span>${cart[i].name}</span>
                    <span>NT$ ${cart[i].price}</span>
                </div>`;
                total += cart[i].price;
            }
            itemList.innerHTML = html;
            totalSpan.innerText = total;
        }

        // 切換購物車視窗顯示/隱藏
        function toggleCartModal() {
            let modal = document.getElementById("cartModal");
            if (modal.style.display === "none") {
                modal.style.display = "block";
            } else {
                modal.style.display = "none";
            }
        }

        // 結帳功能
        function checkout() {
            if (cart.length === 0) {
                alert("購物車是空的，無法結帳！");
                return;
            }
            alert("🎉 結帳成功！感謝您的購買。");
            cart = [];
            updateCartCount();
            toggleCartModal();
        }

        // 粒子特效函式
        function createParticle(x, y) {
            let p = document.createElement("div");
            p.style.position = "fixed";
            p.style.width = "6px";
            p.style.height = "6px";
            p.style.background = "#38bdf8";
            p.style.borderRadius = "50%";
            p.style.boxShadow = "0 0 8px #38bdf8";
            p.style.left = x + "px";
            p.style.top = y + "px";
            p.style.zIndex = "9999";
            document.body.appendChild(p);

            let angle = Math.random() * Math.PI * 2;
            let speed = 4 + Math.random() * 6;
            let dx = Math.cos(angle) * speed;
            let dy = Math.sin(angle) * speed;
            let opacity = 1;

            let moveInterval = setInterval(function() {
                let px = parseFloat(p.style.left);
                let py = parseFloat(p.style.top);
                p.style.left = px + dx + "px";
                p.style.top = py + dy + "px";
                opacity -= 0.05;
                p.style.opacity = opacity;

                if (opacity <= 0) {
                    clearInterval(moveInterval);
                    document.body.removeChild(p);
                }
            }, 16);
        }
    </script>
</body>
</html>
